format = """
$directory\
$git_branch\
$git_status\
$character
"""

add_newline = false

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'

[directory]
truncation_length = 3

[git_branch]
format = '[$branch(:$remote_branch)]($style) '
symbol = ''

[git_status]
format = '([$all_status]($style) )'
style = 'bold yellow'
ahead = ''
behind = ''
diverged = ''
up_to_date = ''
untracked = ''
stashed = ''
renamed = ''
deleted = ''
