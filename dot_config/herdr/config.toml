[theme]
name = "catppuccin"

[keys]
prefix = "ctrl+t"

# pane
last_pane = "prefix+o"

# workspace
previous_workspace = "prefix+up"
next_workspace = "prefix+down"
switch_workspace = "prefix+shift+1..9"

# agent
previous_agent = "prefix+,"
next_agent = "prefix+."

[[keys.command]]
key = "prefix+ctrl+h"
type = "popup"
command = "hx ."
width = "85%"
height = "85%"

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "lazygit"
width = "85%"
height = "85%"

[[keys.command]]
key = "prefix+ctrl+y"
type = "popup"
command = "yazi"
width = "85%"
height = "85%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "to4iki.unread-jump.next"
description = "focus next unread agent"

[ui]
confirm_close = false
hide_tab_bar_when_single_tab = true
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true

[ui.sidebar.spaces]
row_gap = 1

[ui.sidebar.agents]
row_gap = 1

[ui.toast]
delivery = "system"

[ui.sound]
enabled = false

[experimental]
kitty_graphics = true
switch_ascii_input_source_in_prefix = false
